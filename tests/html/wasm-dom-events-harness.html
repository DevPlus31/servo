const logEl = document.getElementById("log");
let failures = 0;
function say(m, c) {
  console.log(m);
  const d = document.createElement("div");
  if (c) d.className = c;
  d.textContent = m;
  logEl.appendChild(d);
}
function check(cond, what) {
  if (cond) say("PASS  " + what, "ok");
  else { failures++; say("FAIL  " + what, "fail"); }
}
function counterText() {
  for (const d of document.getElementsByTagName("div"))
    if (d.id !== "log" && /^clicks: /.test(d.textContent)) return d.textContent;
  return null;
}

(function () {
 try {
  logEl.textContent = "";
  say("step: start");
  if (typeof ServoWasmDom === "undefined") {
    say("FAIL  ServoWasmDom undefined — needs --features wasm_dom and the pref", "fail");
    return;
  }

  const id = ServoWasmDom.createInstance();
  say("step: createInstance -> " + id);
  const imports = ServoWasmDom.importObject(id);
  say("step: importObject ok");
  const mod = new WebAssembly.Module(WASM);
  say("step: Module compiled");
  const instance = new WebAssembly.Instance(mod, imports);
  say("step: Instance created");
  ServoWasmDom.bindMemory(id, instance.exports.memory);
  ServoWasmDom.bindDispatcher(id, instance.exports._servo_dom_dispatch);
  check(true, "module instantiated, memory and dispatcher bound");

  say("step: calling _servo_dom_start");
  instance.exports._servo_dom_start();
  say("step: _servo_dom_start returned");
  const buttons = document.getElementsByTagName("button");
  check(buttons.length === 2, "module created two buttons (got " + buttons.length + ")");
  const minus = buttons[0], plus = buttons[1];
  check(minus.textContent === "-" && plus.textContent === "+",
        "buttons are labelled - and + (got '" + minus.textContent + "', '" + plus.textContent + "')");
  check(counterText() === "clicks: 0", "counter starts at 0 (got " + counterText() + ")");

  // Synthetic click -> the DOM dispatches -> the host trampoline -> the module's handler.
  say("step: about to dispatchEvent");
  plus.dispatchEvent(new Event("click"));
  say("step: dispatchEvent returned");
  check(counterText() === "clicks: 1", "one + click -> 1 (got " + counterText() + ")");

  plus.click();
  plus.click();
  check(counterText() === "clicks: 3", "three + clicks -> 3 (got " + counterText() + ")");

  // The second callback id must reach a different handler through the same dispatcher.
  minus.click();
  check(counterText() === "clicks: 2", "- click -> 2 (got " + counterText() + ")");
  for (let i = 0; i < 5; i++) minus.click();
  check(counterText() === "clicks: -3", "counter goes negative (got " + counterText() + ")");
  for (let i = 0; i < 3; i++) plus.click();
  check(counterText() === "clicks: 0", "back to zero (got " + counterText() + ")");

  // The listener holds two long-lived handles by design (the counter node, and nothing else
  // transient), so assert it is not *growing* per click rather than that it is zero.
  const before = ServoWasmDom.handleCount(id);
  plus.click();
  minus.click();
  const after = ServoWasmDom.handleCount(id);
  check(after === before, "a click leaks no handles (" + before + " -> " + after + ")");

  for (let i = 0; i < 12; i++) plus.click();
  check(counterText() === "clicks: 12",
        "multi-digit counter past ten (got " + counterText() + ")");

  ServoWasmDom.tearDown(id);
  const afterTeardown = counterText();
  plus.click();
  check(counterText() === afterTeardown,
        "a listener whose instance was torn down is a silent no-op");

  say("");
  say(failures === 0 ? "ALL CHECKS PASSED" : failures + " CHECK(S) FAILED",
      failures === 0 ? "ok" : "fail");
 } catch (e) { say("FAIL  threw: " + e, "fail"); }
