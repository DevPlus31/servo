# The `wasm_dom` Cargo feature ships in `default_web_features` on this fork, so a normal
# build has `ServoWasmDom` and these tests run as part of a plain `./mach test-wpt`.
#
# On a build *without* the feature they must be disabled instead: every subtest would report
# PRECONDITION_FAILED against an expected PASS, which wptrunner counts as unexpected -- 70
# failures across the suite. `assert_implements_optional` sets the status, not the
# expectation. To disable, add a line reading `disabled: needs the wasm_dom Cargo feature`.
#
# The pref is set explicitly even though it also defaults on, so the tests never depend on
# a default that is one line away from changing.
prefs: [
  "dom_wasm_dom_enabled:true",
]
