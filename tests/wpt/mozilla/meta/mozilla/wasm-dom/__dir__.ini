# Disabled by default, because these tests exercise the experimental `wasm_dom` Cargo feature
# and that feature is off in a normal build. Without it `ServoWasmDom` does not exist, so
# every test reports PRECONDITION_FAILED against an expected PASS and the whole run fails --
# 70 unexpected results across the four files. Measured, not guessed.
#
# To run them: build with `--features wasm_dom`, then delete the `disabled:` line below.
disabled: needs the wasm_dom Cargo feature, which is off by default

prefs: [
  "dom_wasm_dom_enabled:true",
]
